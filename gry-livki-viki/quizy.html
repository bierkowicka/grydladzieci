<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gry Livki i Viki">
<link rel="manifest" href="manifest.webmanifest">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bajkowe Quizy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: ekran wyboru z dwiema dużymi kartami quizów, potem jedno pytanie na ekran z paskiem postępu, na końcu wynik z gwiazdkami. */
:root{
  --bg:#f6f1fb;       /* lawendowy papier */
  --paper:#ffffff;
  --ink:#2a1f45;
  --muted:#6d6390;
  --line:#e2d8f1;
  --rose:#d9467a;     /* quiz o księżniczkach */
  --rose-soft:#fbe3ec;
  --sea:#11869b;      /* quiz o Luce */
  --sea-soft:#d8f1f4;
  --ice:#2f6fc7;--ice-soft:#dde9fa;--toy:#c4620f;--toy-soft:#fbe7d4;--zoo:#6b4fc8;--zoo-soft:#e8e1fa;--blue:#3559c7;--blue-soft:#e0e6fa;--hx:#a82bb5;--hx-soft:#f6e0f8;
  --good:#2f9e5b;--good-bg:#e0f5e8;
  --bad:#d4483b;--bad-bg:#fde4e1;
  --gold:#f5b800;
  --shadow:0 4px 0 #ddd0ee;
  --display:"Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1530;--paper:#261f43;--ink:#f3eefc;--muted:#b3a8d6;--line:#3a3062;
  --rose:#ff6f9f;--rose-soft:#43213a;--sea:#3cc6db;--sea-soft:#163a45;--ice:#6aa8ff;--ice-soft:#1d2d4d;--toy:#ff9b45;--toy-soft:#3d2a1a;--zoo:#a58cff;--zoo-soft:#2e2552;--blue:#7d9bff;--blue-soft:#1f2850;--hx:#e07bff;--hx-soft:#3a1d45;
  --good:#5ad38e;--good-bg:#173829;--bad:#ff7d70;--bad-bg:#40201f;--gold:#ffcd38;--shadow:0 4px 0 #100c20;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1530;--paper:#261f43;--ink:#f3eefc;--muted:#b3a8d6;--line:#3a3062;
  --rose:#ff6f9f;--rose-soft:#43213a;--sea:#3cc6db;--sea-soft:#163a45;--ice:#6aa8ff;--ice-soft:#1d2d4d;--toy:#ff9b45;--toy-soft:#3d2a1a;--zoo:#a58cff;--zoo-soft:#2e2552;--blue:#7d9bff;--blue-soft:#1f2850;--hx:#e07bff;--hx-soft:#3a1d45;
  --good:#5ad38e;--good-bg:#173829;--bad:#ff7d70;--bad-bg:#40201f;--gold:#ffcd38;--shadow:0 4px 0 #100c20;color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.c-rose{--acc:var(--rose);--acc-soft:var(--rose-soft)}
.c-sea{--acc:var(--sea);--acc-soft:var(--sea-soft)}
.c-ice{--acc:var(--ice);--acc-soft:var(--ice-soft)}
.c-toy{--acc:var(--toy);--acc-soft:var(--toy-soft)}
.c-zoo{--acc:var(--zoo);--acc-soft:var(--zoo-soft)}
.c-blue{--acc:var(--blue);--acc-soft:var(--blue-soft)}
.c-hx{--acc:var(--hx);--acc-soft:var(--hx-soft)}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--rose)}
.sub{margin:6px 0 0;color:var(--muted)}
.voice{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
.voice[aria-pressed="false"]{color:var(--muted)}
.voice span{font-size:20px}

.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.qcard{text-align:left;border:3px solid var(--line);background:var(--paper);border-radius:26px;padding:22px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:8px;transition:transform .15s;position:relative;overflow:hidden}
.qcard:hover{transform:translateY(-4px)}
.qcard::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:var(--acc)}
.qcard .ico{font-size:58px;line-height:1}
.qcard h2{font-family:var(--display);font-weight:800;font-size:28px;margin:4px 0 0;line-height:1.1}
.qcard p{margin:0;color:var(--muted)}
.qcard .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:14px;border-radius:999px;padding:4px 12px}

.panel{background:var(--paper);border:3px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px}
.back{border:2px solid var(--line);background:none;border-radius:12px;padding:6px 12px;font-weight:700;font-size:15px}
.bar{flex:1;height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .4s}
.num{font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qrow{display:flex;gap:12px;align-items:flex-start}
.question{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,30px);line-height:1.2;margin:0;text-wrap:balance;flex:1;min-width:0}
.listen{flex:none;border:0;background:var(--acc);color:#fff;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;box-shadow:var(--shadow)}
.listen svg{width:26px;height:26px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.answers{grid-template-columns:1fr}}
.ans{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--line);background:var(--bg);border-radius:18px;padding:14px 16px;font-weight:700;font-size:18px;min-height:64px}
.ans b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-family:var(--display);font-size:18px}
.ans:hover:not(:disabled){border-color:var(--acc)}
.ans:disabled{cursor:default}
.ans.right{border-color:var(--good);background:var(--good-bg)}
.ans.right b{background:var(--good);color:#fff}
.ans.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
.ans.wrong b{background:var(--bad);color:#fff}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:1.5em;font-family:var(--display);font-weight:700;font-size:21px;text-align:center}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.score{display:flex;justify-content:center;gap:6px;font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

.result{text-align:center;align-items:center}
.result .big{font-family:var(--display);font-weight:800;font-size:clamp(56px,16vw,88px);line-height:1;color:var(--acc);font-variant-numeric:tabular-nums}
.result h2{font-family:var(--display);font-weight:800;font-size:30px;margin:0}
.stars{font-size:48px;letter-spacing:6px}
.stars .off{filter:grayscale(1);opacity:.3}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{border:0;border-radius:16px;padding:14px 22px;font-family:var(--display);font-weight:700;font-size:19px;background:var(--acc);color:#fff;box-shadow:var(--shadow)}
.btn.alt{background:var(--paper);color:var(--ink);border:3px solid var(--line)}
.best{color:var(--muted);font-size:15px;margin:0}
.note{color:var(--muted);font-size:14px;margin:0;max-width:65ch}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div>
      <h1>Bajkowe <em>Quizy</em></h1>
      <p class="sub">Wybierz quiz i sprawdź, ile pamiętasz z bajek.</p>
    </div>
    <button class="voice" id="voice" aria-pressed="true"><span aria-hidden="true">🔊</span><span id="voiceLbl">Lektor czyta</span></button>
  </header>

  <section id="home" class="pick"></section>

  <section id="play" class="panel" hidden>
    <div class="top">
      <button class="back" id="quit">← Quizy</button>
      <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
      <div class="num" id="qnum">1 / 30</div>
    </div>
    <div class="qrow">
      <h2 class="question" id="qtext"></h2>
      <button class="listen" id="listen" aria-label="Przeczytaj pytanie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    </div>
    <div class="answers" id="answers"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="score">Dobre odpowiedzi: <span id="good">0</span></div>
  </section>

  <section id="result" class="panel result" hidden>
    <div class="stars" id="rstars"></div>
    <h2 id="rtitle"></h2>
    <div class="big" id="rscore"></div>
    <p class="best" id="rbest"></p>
    <div class="btns"><button class="btn" id="again">Zagraj jeszcze raz</button><button class="btn alt" id="home2">Wybierz inny quiz</button></div>
  </section>

  <p class="note">Pytania i odpowiedzi czyta polski głos wbudowany w przeglądarkę. Kolejność odpowiedzi zmienia się przy każdej grze.</p>
</div>

const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const LETTERS='ABCD';

/* --- lektor --- */
const synth=window.speechSynthesis;let vPL=null,token=0,voiceOn=true;
try{voiceOn=localStorage.getItem('bq-voice')!=='0'}catch(e){}
function pickV(){if(!synth)return;const v=synth.getVoices();vPL=v.find(x=>/^pl/i.test(x.lang)&&/Zosia|Paulina|Ewa|female/i.test(x.name))||v.find(x=>/^pl/i.test(x.lang))||null}
if(synth){pickV();synth.onvoiceschanged=pickV}
function say(text,done,force){
  const t=++token;let fired=false;const fin=()=>{if(!fired&&t===token){fired=true;done&&done()}};
  if(!synth||(!voiceOn&&!force)){if(done)setTimeout(fin,1600);return}
  try{synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=vPL?vPL.lang:'pl-PL';if(vPL)u.voice=vPL;u.rate=.95;u.pitch=1.1;
    u.onend=()=>setTimeout(fin,400);u.onerror=fin;synth.speak(u);if(done)setTimeout(fin,1500+text.length*90)}catch(e){if(done)setTimeout(fin,1600)}
}
function stopVoice(){token++;if(synth)try{synth.cancel()}catch(e){}}
function updVoice(){$('voice').setAttribute('aria-pressed',voiceOn);$('voiceLbl').textContent=voiceOn?'Lektor czyta':'Lektor wyłączony';$('voice').firstElementChild.textContent=voiceOn?'🔊':'🔇'}
$('voice').onclick=()=>{voiceOn=!voiceOn;try{localStorage.setItem('bq-voice',voiceOn?'1':'0')}catch(e){}updVoice();if(!voiceOn)stopVoice()};
updVoice();
if(!synth){$('voice').hidden=true}

/* --- ekran wyboru --- */
function best(k){try{return+localStorage.getItem('bq-best-'+k)||0}catch(e){return 0}}
function renderHome(){
  const h=$('home');h.innerHTML='';
  for(const[k,q]of Object.entries(QUIZZES)){
    const b=document.createElement('button');b.className='qcard '+q.color;
    const bs=best(k);
    b.innerHTML=`<span class="ico" aria-hidden="true">${q.icon}</span><h2>${q.title}</h2><p>${q.desc}</p>
      <div class="meta"><span class="chip">${q.qs.length} pytań</span>${bs?`<span class="chip">Rekord: ${bs} / ${q.qs.length}</span>`:''}</div>`;
    b.onclick=()=>start(k);h.appendChild(b);
  }
}

/* --- gra --- */
let cur=null,order=[],i=0,good=0,busy=false,opts=[];
function show(id){['home','play','result'].forEach(x=>$(x).hidden=x!==id)}
function start(k){
  cur=k;const q=QUIZZES[k];order=shuffle(q.qs);i=0;good=0;
  ['play','result'].forEach(id=>$(id).className=$(id).className.replace(/ ?c-\w+/g,'')+' '+q.color);
  $('good').textContent=0;show('play');ask();
}
function readQ(){const [t]=order[i];say(t+' '+opts.map((o,n)=>LETTERS[n]+': '+o+'.').join(' '),null,true)}
function ask(){
  busy=false;const q=QUIZZES[cur],[t,a]=order[i];
  $('qnum').textContent=`${i+1} / ${order.length}`;$('barFill').style.width=(i/order.length*100)+'%';
  $('qtext').textContent=t;$('fb').textContent='';$('fb').className='fb';
  opts=shuffle(a);const box=$('answers');box.innerHTML='';
  opts.forEach((o,n)=>{const b=document.createElement('button');b.className='ans';b.innerHTML=`<b>${LETTERS[n]}</b><span></span>`;b.lastChild.textContent=o;
    b.onclick=()=>choose(b,o===a[0],a[0]);box.appendChild(b)});
  if(voiceOn)readQ();
}
const PRAISE=['Brawo!','Super!','Świetnie!','Doskonale!','Ekstra!'];
function choose(b,ok,correct){
  if(busy)return;busy=true;
  document.querySelectorAll('.ans').forEach(x=>{x.disabled=true;if(x.lastChild.textContent===correct)x.classList.add('right')});
  let msg;
  if(ok){good++;$('good').textContent=good;msg=PRAISE[Math.random()*PRAISE.length|0];$('fb').textContent=msg;$('fb').className='fb ok'}
  else{b.classList.add('wrong');msg='Niestety. Dobra odpowiedź to: '+correct;$('fb').textContent=msg;$('fb').className='fb no'}
  const g=cur;say(msg,()=>{if(cur===g&&!$('play').hidden)next()});
}
function next(){i++;if(i>=order.length)finish();else ask()}
function finish(){
  const n=order.length,pct=good/n,starsN=pct>=.9?3:pct>=.6?2:pct>=.3?1:0;
  const prev=best(cur);if(good>prev)try{localStorage.setItem('bq-best-'+cur,good)}catch(e){}
  $('barFill').style.width='100%';
  $('rstars').innerHTML=[0,1,2].map(k=>`<span class="${k<starsN?'':'off'}">⭐</span>`).join('');
  const title=starsN===3?'Mistrz bajek!':starsN===2?'Świetny wynik!':starsN===1?'Nieźle!':'Spróbuj jeszcze raz!';
  $('rtitle').textContent=title;$('rscore').textContent=`${good} / ${n}`;
  $('rbest').textContent=good>prev&&prev>0?'Nowy rekord!':`Rekord: ${Math.max(prev,good)} / ${n}`;
  show('result');say(`${title} Masz ${good} dobrych odpowiedzi na ${n}.`);
}
$('listen').onclick=readQ;
$('quit').onclick=()=>{stopVoice();cur=null;renderHome();show('home')};
$('home2').onclick=()=>{stopVoice();cur=null;renderHome();show('home')};
$('again').onclick=()=>start(cur);

renderHome();
})();
</script>
